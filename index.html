<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TradeScan — Vendor Recovery Portal</title>
<meta name="description" content="TradeScan vendor recovery portal — demo build with illustrative data.">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B4F8F'/%3E%3Cpath d='M7 21l5-7 4 3 8-10' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<script>
/* Demo gate. Front-end only — there is no server and no real account.
   Keeps the pitch flow (sign in → portal) intact; it is not a security control. */
(function () {
  var ok = false;
  try { ok = sessionStorage.getItem('ts-demo-session') === '1'; } catch (e) { ok = true; }
  if (!ok) location.replace('login.html');
})();
</script>
</head>
<body>
<div class="app">

  <aside class="rail" id="rail">
    <div class="mark">
      <svg width="26" height="26" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="var(--brand)"/>
        <path d="M7 21l5-7 4 3 8-10" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div><b>TradeScan</b><small>Recovery Portal</small></div>
    </div>
    <div class="nav-sec">Recovery</div>
    <nav class="nav" id="nav" aria-label="Modules"></nav>
    <div class="rail-f">V-2.0.5 · Demo build</div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <header class="phead">
      <div class="crumbs" id="crumbs">Dashboard</div>
      <div class="prow">
        <button class="menu-btn" id="menuBtn" aria-label="Open navigation">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M3 6h14M3 10h14M3 14h14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </button>
        <h1 id="ptitle">Dashboard</h1>
        <div class="spacer"></div>
        <div class="ctx">
          <span>Vendor</span><span class="cur">US - Rebelution US</span>
        </div>
        <select class="sel" aria-label="Amazon VC Account">
          <option>US - Rebelution US</option><option>US - Vantio</option><option>US - PureStride</option>
          <option>US - NordFlask</option><option>US - CoreGuard</option>
        </select>
        <button class="bell" id="themeBtn" aria-label="Toggle dark mode" title="Toggle dark mode">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M16 11.2A6.4 6.4 0 0 1 8.8 4a6.6 6.6 0 1 0 7.2 7.2z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
        </button>
        <button class="bell" aria-label="Notifications">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M10 3a4.4 4.4 0 0 1 4.4 4.4c0 3.1 1.1 4.2 1.1 4.2H4.5s1.1-1.1 1.1-4.2A4.4 4.4 0 0 1 10 3z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M8.3 14.2a1.8 1.8 0 0 0 3.4 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <i>3</i>
        </button>
        <div class="avatar">RB</div>
        <button class="bell" id="signout" aria-label="Sign out" title="Sign out">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M12 6V4.6A1.6 1.6 0 0 0 10.4 3H5.6A1.6 1.6 0 0 0 4 4.6v10.8A1.6 1.6 0 0 0 5.6 17h4.8a1.6 1.6 0 0 0 1.6-1.6V14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M9 10h8m0 0-2.6-2.6M17 10l-2.6 2.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </header>

    <main class="view" id="view"></main>
  </div>
</div>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="sheet">
    <div class="sh"><h2 id="mTitle">Details</h2><button id="mClose" aria-label="Close">✕</button></div>
    <div id="mBody"></div>
  </div>
</div>

<div class="toast" id="toast" hidden role="status">
  <span class="tk"><svg width="15" height="15" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.4" stroke="currentColor" stroke-width="1.5"/><path d="m5.4 8.2 1.8 1.8 3.4-3.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
  <span id="toastMsg"></span>
</div>

<script src="assets/app.js"></script>
</body>
</html>
