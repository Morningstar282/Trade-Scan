[build]
  publish = "."
  command = ""

# Static single-page site. Routing is hash-based (#ongoing, #coop, ...),
# so no SPA rewrite is needed, but this keeps deep links safe if that changes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Demo site — keep it out of search results.
    X-Robots-Tag = "noindex, nofollow"

# Demo site under active iteration: always revalidate, so a push shows up on
# the next reload instead of being masked by a cached styles.css / app.js.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
